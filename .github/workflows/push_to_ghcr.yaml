name: Publish split images to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose templates
        env:
          TAG: sha-validation
          SERVER_URL: https://crm.example.com
          APP_SECRET: validation-only
          POSTGRES_PASSWORD: validation-only
          BACKEND_UPSTREAM: http://10.77.0.1:3000
        run: |
          docker compose -f packages/twenty-docker/split/compose.backend.yaml config --quiet
          docker compose -f packages/twenty-docker/split/compose.frontend.yaml config --quiet
      - name: Check frontend proxy behavior
        run: python3 packages/twenty-docker/split/tests/proxy-smoke.py
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: twenty-backend
            target: twenty-server
          - image: twenty-frontend
            target: twenty-front
    steps:
      - uses: actions/checkout@v4
      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Lowercase registry namespace
        id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable digest
        env:
          IMAGE: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
