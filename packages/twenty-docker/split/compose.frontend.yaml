name: twenty-frontend

services:
  frontend:
    image: ghcr.io/nnn706/twenty-frontend:${TAG:?Set matching immutable image tag}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3001}:8080"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?Set private backend URL without trailing slash}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/frontend-healthz || exit 1']
      interval: 15s
      timeout: 3s
      retries: 3
